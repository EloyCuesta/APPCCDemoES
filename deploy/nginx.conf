events {}
http {
    # Re-resolve Compose services after a container is replaced.
    resolver 127.0.0.11 valid=5s;
    upstream api_backend {
        zone api_backend 64k;
        server backend:80 resolve;
    }
    upstream ui_frontend {
        zone ui_frontend 64k;
        server frontend:3000 resolve;
    }
    # This container has no published ports. Only the HTTPS proxy is an ingress.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    log_format appcc '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout appcc;
    error_log /dev/stderr warn;
    server {
        listen 80;
        client_max_body_size 24m;
        limit_req_status 429;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_cache off;
        # The first account is provisioned over SSH through the internal API.
        location = /api/onboarding { return 403; }
        location ~ ^/api/(login_check|auth/configurar-password|invitaciones/aceptar)$ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_backend;
        }
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend;
        }
        location / {
            proxy_pass http://ui_frontend;
        }
    }
}
