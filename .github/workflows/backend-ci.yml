name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP 8.3 / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: appcc
          POSTGRES_PASSWORD: appcc
          POSTGRES_DB: appcc_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appcc -d appcc_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret

      DATABASE_URL: 'postgresql://appcc:appcc@127.0.0.1:5432/appcc_ci?serverVersion=18&charset=utf8'

      APPCC_TEST_DATABASE: appcc_ci_test
      APPCC_DEV_DATABASE: appcc_ci

      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate temporary JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Lint Symfony container
        run: php bin/console lint:container

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate

      - name: Load initial APPCC templates
        run: php bin/console app:plantillas:cargar

      - name: Run PHPUnit
        run: php bin/phpunit

      - name: Prepare isolated live demonstration database
        env:
          APP_ENV: dev
          APP_DEBUG: '0'
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
          php bin/console app:demo:seed
          php bin/console app:tareas:procesar

      - name: Setup Node for full MVP acceptance
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Exercise the MVP against Symfony and PostgreSQL
        working-directory: frontend
        env:
          APP_ENV: dev
          APP_DEBUG: '0'
        run: npm run test:live
